<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户服务中心</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#1e3a8a,#3b82f6); min-height:100vh;
    display:flex; align-items:center; justify-content:center; color:#fff; padding:20px; }
  .card { background:#fff; color:#1e293b; border-radius:20px; padding:44px 36px;
    width:100%; max-width:400px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .logo { font-size:56px; }
  h1 { font-size:24px; margin:14px 0 8px; }
  .sub { color:#64748b; font-size:14px; margin-bottom:28px; }
  .btn { display:block; background:#3b82f6; color:#fff; text-decoration:none;
    padding:14px; border-radius:12px; font-size:17px; font-weight:600; margin-bottom:12px; }
  .btn:active { opacity:.9; }
  .btn.ghost { background:#f1f5f9; color:#334155; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">💬</div>
  <h1>用户服务中心</h1>
  <div class="sub">7×24 小时在线，随时为您解答</div>
  <a class="btn" href="/chat.html">开始咨询</a>
  <a class="btn ghost" href="/admin.html">客服工作台</a>
</div>
</body>
</html>
